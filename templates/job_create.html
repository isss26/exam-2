{% extends "base.html" %}
{% block title %}Create job{% endblock %}
{% block container_class %}container-narrow{% endblock %}
{% block content %}
<div class="page-header"><h1>Create job</h1></div>
<form method="post" class="card form-card stack">
    {% csrf_token %}
    <div class="field"><label for="title">Title</label><input name="title" id="title" placeholder="Title" required></div>
    <div class="field"><label for="description">Description</label><textarea name="description" id="description" placeholder="Description" required></textarea></div>
    <div class="field"><label for="salary">Salary</label><input type="number" step="0.01" name="salary" id="salary" placeholder="Salary" required></div>
    <div class="field"><label for="location">Location</label><input name="location" id="location" placeholder="Location" required></div>
    <div class="field">
        <label for="employment_type">Employment type</label>
        <select name="employment_type" id="employment_type">
            {% for value, name in employment_types %}
                <option value="{{ value }}">{{ name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label for="company">Company</label>
        <select name="company" id="company" required>
            {% for i in companies %}
                <option value="{{ i.id }}">{{ i.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label for="category">Category</label>
        <select name="category" id="category" required>
            {% for i in categories %}
                <option value="{{ i.id }}">{{ i.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn" href="{% url 'job_list' %}">Back</a>
    </div>
</form>
{% endblock %}
