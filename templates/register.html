{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth-card" style="margin: var(--space-7) auto 0;">
    <h1>Register</h1>
    {% if error %}
        <p class="alert">{{ error }}</p>
    {% endif %}
    <form method="post" class="stack">
        {% csrf_token %}
        <div class="field"><label for="username">Username</label><input type="text" name="username" id="username" placeholder="Enter your username"></div>
        <div class="field"><label for="email">Email</label><input type="email" name="email" id="email" placeholder="Enter your email"></div>
        <div class="field"><label for="password1">Password</label><input type="password" name="password1" id="password1" placeholder="Enter your password"></div>
        <div class="field"><label for="password2">Confirm password</label><input type="password" name="password2" id="password2" placeholder="Repeat your password"></div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="auth-alt"><a href="{% url 'login' %}">Already have an account? LOGIN</a></p>
</div>
{% endblock %}
