{% extends "base.html" %}
{% block title %}Delete job{% endblock %}
{% block container_class %}container-narrow{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Delete "{{ job.title }}"?</h1>
    <p class="meta">This action cannot be undone.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-solid-danger">Delete</button>
        <a class="btn" href="{% url 'job_detail' job.id %}">Back</a>
    </form>
</div>
{% endblock %}
