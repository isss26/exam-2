{% extends "base.html" %}
{% block title %}Create application{% endblock %}
{% block container_class %}container-narrow{% endblock %}
{% block content %}
<div class="page-header"><h1>Create application</h1></div>
<form method="post" class="card form-card stack">
    {% csrf_token %}
    <div class="field">
        <label for="job">Job</label>
        <select name="job" id="job" required>
            {% for i in jobs %}
                <option value="{{ i.id }}">{{ i.title }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label for="user">User</label>
        <select name="user" id="user" required>
            {% for i in users %}
                <option value="{{ i.id }}">{{ i.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field"><label for="cover_letter">Cover letter</label><textarea name="cover_letter" id="cover_letter" placeholder="Cover letter" required></textarea></div>
    <div class="field">
        <label for="status">Status</label>
        <select name="status" id="status">
            {% for value, name in statuses %}
                <option value="{{ value }}">{{ name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn" href="{% url 'admin_panel' %}">Back</a>
    </div>
</form>
{% endblock %}
