{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card auth-card" style="margin: var(--space-7) auto 0;">
    <h1>Change password</h1>
    {% if error %}
        <p class="alert">{{ error }}</p>
    {% endif %}
    <form method="post" class="stack">
        {% csrf_token %}
        <div class="field"><label for="old_password">Old password</label><input type="password" name="old_password" id="old_password" placeholder="Old password"></div>
        <div class="field"><label for="password1">New password</label><input type="password" name="password1" id="password1" placeholder="New password"></div>
        <div class="field"><label for="password2">Confirm password</label><input type="password" name="password2" id="password2" placeholder="Repeat new password"></div>
        <button type="submit" class="btn btn-primary btn-block">Save</button>
    </form>
</div>
{% endblock %}
