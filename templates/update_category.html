{% extends "base.html" %}
{% block title %}Update category{% endblock %}
{% block container_class %}container-narrow{% endblock %}
{% block content %}
<div class="page-header"><h1>Update category</h1></div>
<form method="post" class="card form-card stack">
    {% csrf_token %}
    <div class="field"><label for="name">Name</label><input name="name" id="name" value="{{ category.name }}" required></div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn" href="{% url 'admin_panel' %}">Back</a>
    </div>
</form>
{% endblock %}
