{% extends "base.html" %}
{% block title %}Update company{% endblock %}
{% block container_class %}container-narrow{% endblock %}
{% block content %}
<div class="page-header"><h1>Update company</h1></div>
<form method="post" class="card form-card stack">
    {% csrf_token %}
    <div class="field"><label for="name">Name</label><input name="name" id="name" value="{{ company.name }}" required></div>
    <div class="field"><label for="description">Description</label><textarea name="description" id="description" required>{{ company.description }}</textarea></div>
    <div class="field"><label for="website">Website</label><input type="url" name="website" id="website" value="{{ company.website }}" required></div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn" href="{% url 'admin_panel' %}">Back</a>
    </div>
</form>
{% endblock %}
